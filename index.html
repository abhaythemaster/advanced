  <style>
/* AbhayTheMaster Projects – design tokens, layout and components */
:root {
  --bg: #0b101c;
  --bg-2: #0e1522;
  --card: #111a2c;
  --card-2: #16213a;
  --border: #223049;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --accent: #2dd4bf;
  --accent-ink: #042f2a;
  --accent-soft: rgba(45, 212, 191, 0.12);
  --warn: #fbbf24;
  --danger: #f87171;
  --radius: 12px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f8fb;
  --bg-2: #eef2f7;
  --card: #ffffff;
  --card-2: #f1f5f9;
  --border: #d9e1ec;
  --text: #0f172a;
  --muted: #526078;
  --accent: #0d9488;
  --accent-ink: #ffffff;
  --accent-soft: rgba(13, 148, 136, 0.1);
  --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; font-family: var(--font); background: var(--bg); color: var(--text);
  line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(900px 400px at 80% -10%, var(--accent-soft), transparent 70%);
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; display: block; }
h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 .5em; letter-spacing: -0.01em; }
p { margin: 0 0 1em; }
code { background: var(--card-2); padding: .1em .4em; border-radius: 6px; font-size: .9em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 8px; z-index: 100; }
.skip:focus { left: 8px; }

.container { width: min(1160px, 100% - 32px); margin-inline: auto; }
main { flex: 1; }
.section { padding: 48px 0; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 20px; }
.section-head h2 { margin: 0; font-size: 1.5rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

/* Header */
.site-header { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(14px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--border); }
.nav { display: flex; align-items: center; gap: 18px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text); }
.brand:hover { text-decoration: none; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: .95rem; }
.nav-links { display: flex; gap: 2px; margin-left: 8px; }
.nav-links a { color: var(--muted); padding: 8px 12px; border-radius: 8px; font-size: .95rem; }
.nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--text); background: var(--card-2); text-decoration: none; }
.nav-spacer { flex: 1; }
.search-form { display: flex; }
.search-form input { width: 190px; }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: background .15s; }
.icon-btn:hover { background: var(--card-2); }
.menu-btn { display: none; }

/* Drawer (mobile nav + mobile filters) */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 88vw); background: var(--bg-2); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform .22s ease; z-index: 70; padding: 16px; overflow-y: auto; }
.drawer.open { transform: none; }
.drawer a { display: block; padding: 12px 8px; color: var(--text); border-bottom: 1px solid var(--border); }
.drawer .drawer-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

/* Controls */
input, select, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; width: 100%; }
textarea { min-height: 110px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); }
label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
.field { margin-bottom: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; background: var(--accent); color: var(--accent-ink); transition: transform .12s, filter .15s; }
.btn:hover { filter: brightness(1.08); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn.secondary { background: transparent; color: var(--text); border-color: var(--border); }
.btn.secondary:hover { background: var(--card-2); filter: none; }
.btn.small { padding: 6px 12px; font-size: .85rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg, .icon-btn svg { width: 18px; height: 18px; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.pcard { display: flex; flex-direction: column; overflow: hidden; transition: transform .15s, border-color .15s; }
.pcard:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.pcard-banner { aspect-ratio: 16 / 7; background: var(--card-2); overflow: hidden; }
.pcard-banner img { width: 100%; height: 100%; object-fit: cover; }
.pcard-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.pcard-title { display: flex; gap: 12px; align-items: center; }
.pcard-title h3 { margin: 0; font-size: 1.05rem; }
.pcard-title h3 a { color: var(--text); }
.pcard-summary { color: var(--muted); font-size: .92rem; margin: 0; }
.pcard-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 6px; }
.icon { width: 48px; height: 48px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--border); object-fit: cover; flex: none; display: grid; place-items: center; font-weight: 800; color: var(--accent); overflow: hidden; }
.icon.lg { width: 84px; height: 84px; border-radius: 18px; font-size: 1.8rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .75rem; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); background: var(--card-2); }
.chip.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); background: var(--accent-soft); }
.chip.stable { color: #34d399; border-color: rgba(52, 211, 153, .4); }
.chip.beta { color: var(--warn); border-color: rgba(251, 191, 36, .4); }
.chip.alpha { color: #fb923c; border-color: rgba(251, 146, 60, .4); }
.chip.archived, .chip.discontinued { color: var(--danger); border-color: rgba(248, 113, 113, .4); }
.img-missing { display: none !important; }

/* Hero */
.hero { padding: 72px 0 40px; }
.hero-grid { display: grid; gap: 40px; grid-template-columns: 1.1fr .9fr; align-items: center; }
.hero-grid.single { grid-template-columns: 1fr; max-width: 760px; }
.eyebrow { display: inline-flex; gap: 8px; align-items: center; font-size: .85rem; color: var(--accent); background: var(--accent-soft); padding: 5px 12px; border-radius: 999px; margin-bottom: 18px; }
.hero h1 { font-size: clamp(2.2rem, 5.4vw, 3.6rem); margin-bottom: 16px; }
.hero p.lead { font-size: 1.1rem; color: var(--muted); max-width: 560px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }

/* Discover layout */
.page-head { padding: 40px 0 8px; }
.page-head h1 { font-size: 2rem; }
.discover { display: grid; grid-template-columns: 250px 1fr; gap: 28px; padding-bottom: 60px; }
.filters { padding: 16px; align-self: start; position: sticky; top: 84px; }
.filters h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar select { width: auto; }
.filter-btn { display: none; }
.pager { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 28px; }
.empty { text-align: center; padding: 56px 16px; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); }
.empty h3 { color: var(--text); margin-bottom: 6px; }
.skeleton { height: 260px; border-radius: var(--radius); background: linear-gradient(90deg, var(--card) 25%, var(--card-2) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.notice { padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-2); margin-bottom: 16px; font-size: .92rem; }
.notice.warn { border-color: rgba(251, 191, 36, .45); color: var(--warn); }
.notice.danger { border-color: rgba(248, 113, 113, .45); color: var(--danger); }
.notice.ok { border-color: rgba(52, 211, 153, .45); color: #34d399; }

/* Project page */
.p-banner { aspect-ratio: 16 / 5; max-height: 320px; width: 100%; background: var(--card-2); border-radius: var(--radius); overflow: hidden; margin-top: 24px; }
.p-banner img { width: 100%; height: 100%; object-fit: cover; }
.p-head { display: flex; gap: 20px; align-items: center; margin: 24px 0; flex-wrap: wrap; }
.p-head h1 { margin: 0 0 4px; font-size: 2rem; }
.p-layout { display: grid; grid-template-columns: 1fr 320px; gap: 28px; padding-bottom: 60px; }
.panel { padding: 20px; margin-bottom: 20px; }
.panel h2 { font-size: 1.15rem; }
.panel h3 { font-size: 1rem; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: .9rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.dl-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
.dl-row:first-of-type { border-top: 0; }
.hash { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .75rem; color: var(--muted); word-break: break-all; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.gallery button { padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: zoom-in; background: var(--card-2); aspect-ratio: 16 / 10; }
.gallery img { width: 100%; height: 100%; object-fit: cover; }
.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th, .table td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--border); vertical-align: top; }
.table th { color: var(--muted); font-weight: 500; border-top: 0; }
.prose h3, .prose h4, .prose h5 { margin-top: 1.2em; }
.prose ul { padding-left: 1.2em; }
.prose li { margin-bottom: .3em; }
.prose.legal h2 { margin-top: 1.8em; font-size: 1.25rem; }
mark.todo { background: rgba(251, 191, 36, .2); color: var(--warn); padding: 0 6px; border-radius: 6px; }

/* Lightbox */
.lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .9); z-index: 90; display: none; align-items: center; justify-content: center; padding: 20px; }
.lightbox.open { display: flex; }
.lightbox img { max-height: 86vh; max-width: 94vw; border-radius: 8px; }
.lightbox .lb-btn { position: absolute; top: 14px; right: 14px; }
.lightbox .lb-cap { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #cbd5e1; font-size: .9rem; }
.lightbox .prev, .lightbox .next { position: absolute; top: 50%; }
.lightbox .prev { left: 14px; } .lightbox .next { right: 14px; }

/* Footer */
.site-footer { border-top: 1px solid var(--border); background: var(--bg-2); padding: 40px 0 24px; margin-top: 40px; }
.foot-grid { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 28px; }
.foot-grid h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.foot-grid ul { list-style: none; padding: 0; margin: 0; }
.foot-grid li { margin-bottom: 6px; }
.foot-grid a { color: var(--text); font-size: .92rem; }
.foot-bottom { border-top: 1px solid var(--border); margin-top: 28px; padding-top: 18px; font-size: .82rem; color: var(--muted); }

@media (max-width: 900px) {
  .nav-links, .search-form { display: none; }
  .menu-btn { display: inline-grid; }
  .hero-grid { grid-template-columns: 1fr; }
  .discover { grid-template-columns: 1fr; }
  .filters { position: static; border: 0; background: none; padding: 0; }
  .filter-btn { display: inline-flex; }
  .p-layout { grid-template-columns: 1fr; }
  .foot-grid { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }


/* ===== v2: blue hero + solid nav (inspired by modern client sites, original content) ===== */
.site-header { background: color-mix(in srgb, var(--bg-2) 94%, transparent); }
.brand { text-transform: uppercase; letter-spacing: .04em; }
.brand-logo { width: 30px; height: 30px; object-fit: contain; image-rendering: pixelated; flex: none; }
.brand-mark { display: none; }

.hero { position: relative; overflow: hidden; padding: 56px 0 72px; min-height: min(78vh, 640px); display: flex; align-items: center;
  color: #fff; background: linear-gradient(135deg, #2f66da 0%, #2c55c4 50%, #3948b4 100%); border-bottom: 1px solid rgba(255,255,255,.08); }
.hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 0 30%, rgba(8, 14, 40, .16) 30% 62%, transparent 62%),
              linear-gradient(115deg, transparent 0 70%, rgba(255,255,255,.05) 70% 86%, transparent 86%); }
.hero > .container { position: relative; }
.hero-inner { text-align: center; display: flex; flex-direction: column; align-items: center; }
.hero-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; text-align: left; }
.hero-brand img { width: 44px; height: 44px; image-rendering: pixelated; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
.hero-brand strong { display: block; line-height: 1.1; }
.hero-brand span { font-size: .8rem; color: rgba(255,255,255,.7); }
.hero h1 { font-size: clamp(2.3rem, 7vw, 4.4rem); font-weight: 800; letter-spacing: -.02em; max-width: 14ch; margin: 0 auto 18px; text-shadow: 0 6px 30px rgba(0,0,0,.25); }
.hero p.lead { color: rgba(255,255,255,.88); font-size: clamp(1.02rem, 2.4vw, 1.25rem); max-width: 620px; margin: 0 auto; }
.hero .cta-row { justify-content: center; margin-top: 28px; }
.btn.light { background: #eef2ff; color: #0f1a3d; border-color: rgba(255,255,255,.7); box-shadow: 0 3px 0 rgba(8,14,40,.35); }
.btn.dark { background: #101a30; color: #fff; border-color: rgba(255,255,255,.18); box-shadow: 0 3px 0 rgba(0,0,0,.4); }
.btn.light, .btn.dark { padding: 12px 22px; border-radius: 8px; }
.hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 28px; margin: 30px 0 0; padding: 0; list-style: none; font-size: .9rem; color: rgba(255,255,255,.78); }
#hero-feature { width: min(440px, 100%); margin: 40px auto 0; text-align: left; color: var(--text); }
#hero-feature:empty { display: none; }
.hero .px { position: absolute; width: 46px; height: 34px; background: rgba(255,240,224,.14); border-radius: 3px; animation: floaty 7s ease-in-out infinite; }
.hero .p1 { left: 5%; top: 12%; } .hero .p2 { right: 7%; bottom: 14%; width: 34px; height: 26px; animation-delay: -3s; } .hero .p3 { right: 18%; top: 10%; width: 22px; height: 22px; animation-delay: -5s; }
@keyframes floaty { 50% { transform: translateY(-10px); } }
.section-head h2 { font-size: clamp(1.5rem, 3.4vw, 2rem); }
body::before { background: radial-gradient(900px 500px at 50% 110%, rgba(72, 82, 200, .18), transparent 70%); }
@media (max-width: 900px) { .hero { padding: 36px 0 52px; min-height: 0; } .hero-brand { margin-bottom: 18px; } }

/* ===== owner area ===== */
.fab { position: fixed; right: 18px; bottom: 22px; z-index: 45; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(0,0,0,.45); transition: transform .15s; }
.fab:hover { transform: scale(1.06); text-decoration: none; }
.fab svg { width: 28px; height: 28px; stroke-width: 2.6; }
.owner-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.thumb-row, .shot-row { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.thumb { width: 84px; height: 84px; object-fit: cover; border-radius: 12px; border: 1px solid var(--border); background: var(--card-2); flex: none; }
.empty-thumb { display: grid; place-items: center; font-size: .7rem; color: var(--muted); text-align: center; }
.shot-row .thumb { width: 72px; height: 48px; border-radius: 8px; }
.dl-edit { display: grid; gap: 8px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card-2); }
details summary { cursor: pointer; }
@media (max-width: 900px) { .fab { right: 14px; bottom: 16px; } }

  `<div class="field"><label for="${id}">${label}</label>${area
    ? `<textarea id="${id}" ${max ? `maxlength="${max}"` : ''} placeholder="${esc(ph)}">${esc(value)}</textarea>`
    : `<input id="${id}" type="${type}" value="${esc(value)}" ${max ? `maxlength="${max}"` : ''} placeholder="${esc(ph)}">`}${hint ? `<div class="small muted">${hint}</div>` : ''}</div>`;

function slugify(name) {
  const s = String(name || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60).replace(/-+$/, '');
  return s || 'project';
}
function uniqueSlug(base, taken) {
  let s = base, n = 2;
  while (taken.has(s)) s = `${base}-${n++}`;
  return s;
}

/** Validate a download link. Returns '' if fine, else the problem. */
function linkProblem(u) {
  let x;
  try { x = new URL(String(u).trim()); } catch { return 'is not a valid link'; }
  if (x.protocol !== 'https:') return 'must start with https://';
  if (String(u).length > 2000) return 'is too long';
  return '';
}

/* ---------- Image preparation (shrinks phone photos before upload) ---------- */
async function processImage(file, kind) {
  if (!file.type.startsWith('image/')) throw new Error('Please choose an image file.');
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw new Error('Could not read this image. Please use a JPG, PNG or WebP picture.'); }
  const icon = kind === 'icon';
  let w, h, sx = 0, sy = 0, sw = bmp.width, sh = bmp.height;
  if (icon) {
    const s = Math.min(bmp.width, bmp.height);
    sx = (bmp.width - s) / 2; sy = (bmp.height - s) / 2; sw = sh = s; w = h = Math.min(256, s);
  } else {
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    w = Math.round(bmp.width * k); h = Math.round(bmp.height * k);
  }
  const type = icon ? 'image/png' : 'image/jpeg';
  for (const [scale, q] of [[1, 0.86], [1, 0.72], [0.8, 0.7], [0.6, 0.65]]) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * scale)); c.height = Math.max(1, Math.round(h * scale));
    const g = c.getContext('2d');
    if (!icon) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
    g.imageSmoothingQuality = 'high';
    g.drawImage(bmp, sx, sy, sw, sh, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, type, q));
    if (!blob || blob.type !== type) throw new Error('Your browser could not prepare this image.');
    if (blob.size <= 1.8 * 1024 * 1024) { bmp.close?.(); return blob; }
  }
  throw new Error('Image is too big even after shrinking. Try a smaller picture.');
}

/* ---------- Entry point ---------- */
async function mountOwner(el, path, c) {
  host = el; ctx = c;
  const sub = path.replace(/^\/admin\/?/, '');
  if (!isSignedIn()) return renderLogin();
  if (sub === 'new') return renderEditor(null);
  if (sub.startsWith('edit/')) return renderEditor(decodeURIComponent(sub.slice(5)));
  return renderDashboard();
}

const shell = (inner) => `<div class="container" style="padding:24px 0 100px;max-width:860px">
  <div class="owner-bar"><span class="small muted">Signed in as ${esc(userEmail())}</span>
    <span><a class="btn secondary small" href="/" data-link>View site</a> <button class="btn secondary small" type="button" id="logout">Sign out</button></span></div>${inner}</div>`;

function bindShell() {
  $('#logout')?.addEventListener('click', () => { signOut(); ctx.authChanged(); ctx.go('/admin'); });
}

  host.innerHTML = `<div class="container" style="padding:56px 0;max-width:420px">

function imageSlot(id, src, label, onPick, onClear) {
  const el = $(id);
  el.innerHTML = `<div class="thumb-row">${src ? `<img class="thumb" src="${esc(safeUrl(src))}" alt="">` : '<div class="thumb empty-thumb">No image</div>'}
    <div><label class="btn secondary small" style="cursor:pointer">${src ? 'Change' : label}<input type="file" accept="image/*" hidden></label>
    ${src ? '<button class="btn secondary small" type="button" data-clear>Remove</button>' : ''}<div class="small muted" data-status></div></div></div>`;
  const input = $('input', el), status = $('[data-status]', el);
  input.onchange = async () => {
    const f = input.files[0]; if (!f) return;
    status.textContent = 'Uploading…';
    ed.busy++;
    try { await onPick(f); } catch (err) { status.textContent = err.message; } finally { ed.busy--; }
  };
  $('[data-clear]', el)?.addEventListener('click', onClear);
}
const upload = async (file, kind) => { const url = await uploadImage(await processImage(file, kind)); ed.uploaded.push(url); return url; };
const drawIcon = () => imageSlot('#ed-icon', ed.icon, 'Add logo', async (f) => { ed.icon = await upload(f, 'icon'); drawIcon(); }, () => { ed.icon = ''; drawIcon(); });
const drawBanner = () => imageSlot('#ed-banner', ed.banner, 'Add banner', async (f) => { ed.banner = await upload(f, 'banner'); drawBanner(); }, () => { ed.banner = ''; drawBanner(); });

function syncShots() { host.querySelectorAll('[data-alt]').forEach((i) => { ed.shots[+i.dataset.alt].alt = i.value; }); }
function drawShots() {
  const el = $('#ed-shots');
  el.innerHTML = `${ed.shots.map((s, i) => `<div class="shot-row"><img class="thumb" src="${esc(safeUrl(s.src))}" alt="">
      <div style="flex:1;min-width:0"><input data-alt="${i}" value="${esc(s.alt)}" placeholder="Describe this picture (optional)" maxlength="140" aria-label="Description for screenshot ${i + 1}"></div>
      <button class="btn secondary small" type="button" data-rm="${i}" aria-label="Remove screenshot ${i + 1}">Remove</button></div>`).join('')}
    ${ed.shots.length < 12 ? `<label class="btn secondary small" style="cursor:pointer">+ Add screenshots<input type="file" accept="image/*" multiple hidden id="shot-in"></label>` : '<p class="small muted">Maximum 12 screenshots.</p>'}
    <div class="small muted" id="shot-status"></div>`;
  el.querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => { syncShots(); ed.shots.splice(+b.dataset.rm, 1); drawShots(); }));
  const input = $('#shot-in', el);
  if (input) input.onchange = async () => {
    syncShots();
    const files = [...input.files].slice(0, 12 - ed.shots.length); const st = $('#shot-status');
    ed.busy++;
    try {
      for (let i = 0; i < files.length; i++) {
        st.textContent = `Uploading ${i + 1} of ${files.length}…`;
        ed.shots.push({ src: await upload(files[i], 'shot'), alt: '' });
      }
      drawShots();
    } catch (err) { st.textContent = err.message; drawShotsKeepMsg(err.message); } finally { ed.busy--; }
  };
}
function drawShotsKeepMsg(m) { drawShots(); const s = $('#shot-status'); if (s) s.textContent = m; }

function syncDl() {
  host.querySelectorAll('[data-dl]').forEach((row) => {
    const i = +row.dataset.dl;
    ed.downloads[i] = { label: $('[data-f=label]', row).value, url: $('[data-f=url]', row).value, note: $('[data-f=note]', row).value };
  });
}
function drawDl() {
  const el = $('#ed-dl');
  el.innerHTML = `${ed.downloads.map((d, i) => `<div class="dl-edit" data-dl="${i}">
    <input data-f="label" value="${esc(d.label)}" placeholder="Button text, e.g. Download v1.0" maxlength="60" aria-label="Button text ${i + 1}">
    <input data-f="url" type="url" value="${esc(d.url)}" placeholder="https://…" maxlength="2000" aria-label="Link ${i + 1}">
    <input data-f="note" value="${esc(d.note || '')}" placeholder="Note, e.g. Mirror / 12 MB (optional)" maxlength="80" aria-label="Note ${i + 1}">
    ${ed.downloads.length > 1 || d.url ? `<button class="btn secondary small" type="button" data-rmdl="${i}">Remove link</button>` : ''}</div>`).join('')}
    <button class="btn secondary small" type="button" id="add-dl">+ Add another link</button>`;
  $('#add-dl').onclick = () => { syncDl(); ed.downloads.push({ label: '', url: '', note: '' }); drawDl(); };
  el.querySelectorAll('[data-rmdl]').forEach((b) => (b.onclick = () => { syncDl(); ed.downloads.splice(+b.dataset.rmdl, 1); if (!ed.downloads.length) ed.downloads.push({ label: '', url: '', note: '' }); drawDl(); }));
}

async function save(status) {
  const err = $('#eerr'); msg(err, '');
  if (ed.busy) return msg(err, 'Please wait for the image upload to finish.');
  syncShots(); syncDl();
  const name = val('f-name').trim();
  if (!name) return msg(err, 'Please enter a name.');
  const downloads = [];
  for (const [i, d] of ed.downloads.entries()) {
    const url = String(d.url || '').trim();
    if (!url) continue;
    const bad = linkProblem(url);
    if (bad) return msg(err, `Download link ${i + 1} ${bad}.`);
    downloads.push({ label: String(d.label || '').trim() || 'Download', url, ...(String(d.note || '').trim() ? { note: String(d.note).trim() } : {}) });
  }
  const repo = val('f-repo').trim();
  if (repo && !isRepo(repo)) return msg(err, 'GitHub repository must look like owner/repo.');
  const source = val('f-source').trim();
  if (source && linkProblem(source)) return msg(err, 'Source code link must start with https://');
  const q = ed.p;
  const slug = q.slug || uniqueSlug(slugify(name), ed.taken);
  const out = {
    id: q.id, slug, status, name, type: val('f-type'), summary: val('f-summary').trim(), description: val('f-desc').trim(),
    tags: csv(val('f-tags')).slice(0, 20), version: val('f-version').trim(), icon: ed.icon, banner: ed.banner,
    screenshots: ed.shots.map((s, i) => ({ src: s.src, alt: s.alt.trim() || `${name} screenshot ${i + 1}` })),
    downloads, categories: csv(val('f-cats')), os: csv(val('f-os')), repo, install: val('f-install').trim(),
    compat: { minecraftVersions: csv(val('f-mc')), loaders: csv(val('f-loaders')) },
    license: { name: val('f-lic').trim(), permissions: val('f-licperm').trim() },
    links: source ? { source } : {}, featured: document.getElementById('f-feat').checked, author: q.author || ctx.owner,
  };
  for (const k of ['summary', 'description', 'version', 'icon', 'banner', 'repo', 'install']) if (!out[k]) delete out[k];
  for (const k of ['tags', 'screenshots', 'downloads', 'categories', 'os']) if (!out[k].length) delete out[k];
  if (!out.compat.minecraftVersions.length && !out.compat.loaders.length) delete out.compat;
  if (!out.license.name && !out.license.permissions) delete out.license;
  if (!Object.keys(out.links).length) delete out.links;
  if (!out.id) delete out.id;
  const btns = host.querySelectorAll('#ef button'); btns.forEach((b) => (b.disabled = true));
  try {
    await saveProject({ ...out, id: q.id });
    const final = new Set([out.icon, out.banner, ...(out.screenshots || []).map((s) => s.src)].filter(Boolean));
    await removeImages([...ed.original, ...ed.uploaded].filter((u) => !final.has(u)));
    await ctx.refresh(); ctx.go('/admin');
  } catch (e) {
    let m = e.message || 'Could not save.';
    if (/duplicate key|unique/i.test(m)) m = 'Another project already uses this name. Change the name a little.';
    msg(err, m); btns.forEach((b) => (b.disabled = false));
  }
}

/* ---------- Routing mode ---------- */
// History mode: clean URLs (needs host rewrite). Hash mode (single-file build): #/path?query,
// which works on any static host, including GitHub Pages project sites.
const HASH = window.__HASH_MODE__ === true;
const LOGO = window.__LOGO__ || '/assets/logo.png';
const hashParts = () => {
  const h = location.hash.replace(/^#/, '') || '/';
  const i = h.indexOf('?');
  return i < 0 ? [h, ''] : [h.slice(0, i), h.slice(i)];
};
const curPath = () => (HASH ? hashParts()[0] : location.pathname);
const curSearch = () => (HASH ? hashParts()[1] : location.search);
const urlFor = (u) => (HASH ? `#${u}` : u);
let lastKey = '';

/* ---------- State ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const DATA = { site: {}, projects: [], announcements: [], projectsError: false };
const summaries = new Map();

async function loadJson(path, fallback) {
  try {
    const r = await fetch(path, { cache: 'no-cache' });
    if (!r.ok) throw new Error(String(r.status));
    return await r.json();
  } catch {
    return fallback;
  }
}

const validProject = (p) => p && p.status === 'published' && SLUG_RE.test(p.slug || '') && p.name;

async function loadData() {
  const emb = window.__EMBEDDED__;
  const [site, projects, announcements] = emb
    ? [emb.site, emb.projects, emb.announcements]
    : await Promise.all([
        loadJson('/data/site.json', {}),
        loadJson('/data/projects.json', null),
        loadJson('/data/announcements.json', []),
      ]);
  DATA.site = site || {};
  DATA.projectsError = !Array.isArray(projects);
  // Only explicitly published projects with valid slugs are ever shown.
  DATA.projects = (Array.isArray(projects) ? projects : []).filter(validProject);
  DATA.announcements = (Array.isArray(announcements) ? announcements : [])
    .filter((a) => a && a.status === 'published' && a.title)
    .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

  // Database mode: when Supabase is configured, it is the source of truth.
  const sb = DATA.site.supabase;
  DATA.supaProblem = sb && (sb.url || sb.anonKey) ? configProblem(sb) : 'not-configured';
  if (!DATA.supaProblem && initSupabase(sb)) {
    try {
      const [rows, ann, settings] = await Promise.all([listProjects(), listAnnouncements(), getSettings().catch(() => ({}))]);
      DATA.site = { ...DATA.site, ...settings, supabase: sb };
      DATA.projects = rows.filter(validProject);
      DATA.announcements = ann.map((a) => ({ title: a.title, body: a.body, date: a.created_at, status: 'published' }));
      DATA.projectsError = false;
    } catch (err) {
      console.error(err);
      DATA.projects = []; DATA.announcements = []; DATA.projectsError = true;
    }
  }
}

async function loadSummaries(projects) {
  await Promise.all(
    projects.map(async (p) => {
      if (summaries.has(p.slug)) return;
      summaries.set(p.slug, summarize(await getReleases(p.repo)));
    }),
  );
}
const info = (p) => summaries.get(p.slug) || summarize(null);

/* ---------- Meta / SEO ---------- */
function setMeta({ title, description, path = curPath(), image } = {}) {
  const site = DATA.site;
  const full = title ? `${title} · ${site.name || 'AbhayTheMaster Projects'}` : site.name || 'AbhayTheMaster Projects';
  const desc = description || site.description || '';
  document.title = full;
  const base = (site.baseUrl || location.origin).replace(/\/$/, '');
  const set = (sel, attr, val, create) => {
    let el = $(sel);
    if (!el && create) { el = document.createElement(create.tag); Object.entries(create.attrs).forEach(([k, v]) => el.setAttribute(k, v)); document.head.appendChild(el); }
    if (el) el.setAttribute(attr, val);
  };
  set('meta[name="description"]', 'content', desc);
  set('meta[property="og:title"]', 'content', full);
  set('meta[property="og:description"]', 'content', desc);
  if (!HASH) {
    set('link[rel="canonical"]', 'href', base + path, { tag: 'link', attrs: { rel: 'canonical' } });
    set('meta[property="og:url"]', 'content', base + path, { tag: 'meta', attrs: { property: 'og:url' } });
  }
  const img = safeUrl(image);
  if (img) {
    set('meta[property="og:image"]', 'content', img, { tag: 'meta', attrs: { property: 'og:image' } });
    set('meta[name="twitter:card"]', 'content', 'summary_large_image');
  }
  $('#ld')?.remove();
}

function setJsonLd(obj) {
  $('#ld')?.remove();
  const s = document.createElement('script');
  s.type = 'application/ld+json';
  s.id = 'ld';
  s.textContent = JSON.stringify(obj).replace(/</g, '\\u003c');
  document.head.appendChild(s);
}

  $('#lb-img').alt = s.alt || '';
  $('#lb-cap').textContent = `${s.alt || ''} (${lbIndex + 1}/${currentShots.length})`;
  $('#lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  $('#lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

const channelChip = (c) => `<span class="chip ${esc(c)}">${esc(c)}</span>`;

function releasePanel(p, result, sel) {
  const repoUrl = p.repo ? `https://github.com/${p.repo}/releases` : '';
  const manual = safeUrl(p.releaseUrl);
  const fallbackLink = manual || repoUrl;
  const open = fallbackLink ? `<a class="btn secondary small" href="${esc(fallbackLink)}" target="_blank" rel="noopener noreferrer">Open release page ${I.ext}</a>` : '';
  switch (result.state) {
    case 'loading':
      return `<div class="card panel"><h2>Downloads</h2><div class="skeleton" style="height:90px"></div></div>`;
    case 'unconfigured':
      return `<div class="card panel"><h2>Downloads</h2><p class="muted">No releases available yet.</p>${manual ? `<p class="small muted">The owner has linked an external release page:</p>${open}` : ''}</div>`;
    case 'none':
    case 'notfound':
      return `<div class="card panel"><h2>Downloads</h2><p class="muted">No releases available yet.</p></div>`;
    case 'ratelimited':
      return `<div class="card panel"><h2>Downloads</h2><div class="notice warn">GitHub is rate-limiting requests${result.resetAt ? ` until about ${esc(new Date(result.resetAt).toLocaleTimeString())}` : ''}. Please try again shortly.</div>${open}</div>`;
    case 'error':
      return `<div class="card panel"><h2>Downloads</h2><div class="notice danger">Releases could not be loaded. ${esc(result.message || '')}</div><button class="btn secondary small" type="button" data-retry>Retry</button> ${open}</div>`;
    default:
      return releaseDetail(p, result, sel);
  }
}

function releaseDetail(p, result, sel) {
  const rel = sel;
  const meta = p.releaseMeta?.[rel.tag] || {};
  const mc = meta.minecraftVersions || p.compat?.minecraftVersions || [];
  const loaders = meta.loaders || p.compat?.loaders || [];
  const hasApk = rel.assets.some((a) => /\.apk$/i.test(a.name));
  const checksums = p.checksums || {};
  const assets = rel.assets.length
    ? rel.assets.map((a) => {
        const sha = a.sha256 || checksums[a.name] || '';
        return `<div class="dl-row"><div><strong>${esc(a.name)}</strong><div class="muted small">${esc(fmtBytes(a.size))}${a.downloads ? ` · ${fmtNumber(a.downloads)} downloads` : ''}</div>${sha ? `<div class="hash">SHA-256: ${esc(sha)}</div>` : ''}</div><a class="btn" href="${esc(a.url)}" rel="noopener">${I.download} Download</a></div>`;
      }).join('')
    : `<p class="muted">This release has no downloadable files.</p>`;
  const verSel = result.releases.map((r) => `<option value="${esc(r.tag)}"${r.tag === rel.tag ? ' selected' : ''}>${esc(r.tag)} (${esc(r.channel)})</option>`).join('');
  return `
  <div class="card panel" id="downloads">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
      <h2 style="margin:0">Downloads</h2>
      <div><label class="sr-only" for="ver">Version</label><select id="ver" style="width:auto">${verSel}</select></div>
    </div>
    <p class="muted small">${esc(rel.name)} ${channelChip(rel.channel)} ${rel.date ? `· Published ${esc(fmtDate(rel.date))}` : ''}</p>
    ${mc.length || loaders.length ? `<p class="small">${mc.length ? `Minecraft ${esc(mc.join(', '))}` : ''}${mc.length && loaders.length ? ' · ' : ''}${esc(loaders.join(', '))}</p>` : ''}
    ${assets}
    ${hasApk ? `<div class="notice" style="margin-top:12px"><strong>Android install:</strong> ${p.android?.minAndroid ? `Requires Android ${esc(p.android.minAndroid)} or newer. ` : ''}${p.android?.abis?.length ? `Architectures: ${esc(p.android.abis.join(', '))}. ` : ''}Open the downloaded file and allow “install unknown apps” for your browser or file manager when asked. Only install APKs downloaded from this site, and compare the checksum if one is shown.</div>` : ''}
    ${safeUrl(p.links?.source) ? `<p class="small" style="margin-top:12px"><a href="${esc(safeUrl(p.links.source))}" target="_blank" rel="noopener noreferrer">Source code ${I.ext}</a></p>` : ''}
  </div>
  ${rel.body.trim() ? `<div class="card panel"><h2>Changelog · ${esc(rel.tag)}</h2><div class="prose">${md(rel.body)}</div></div>` : ''}
  <div class="card panel"><h2>Version history</h2><div style="overflow-x:auto"><table class="table"><thead><tr><th>Version</th><th>Channel</th><th>Published</th><th>Files</th></tr></thead><tbody>
  ${result.releases.map((r) => `<tr><td><a href="/project/${esc(p.slug)}?v=${encodeURIComponent(r.tag)}" data-link>${esc(r.tag)}</a></td><td>${channelChip(r.channel)}</td><td>${esc(fmtDate(r.date))}</td><td>${r.assets.length}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}

async function pageProject(slug) {
  const p = DATA.projects.find((x) => x.slug === slug);
  if (!p) return pageNotFound();
  const params = new URLSearchParams(curSearch());
  setMeta({ title: p.name, description: p.summary || p.description?.slice(0, 160), path: `/project/${p.slug}`, image: p.banner || p.icon });
  const banner = safeUrl(p.banner);
  const status = p.releaseStatus;

  const draw = (result) => {
    const sum = summarize(result);
    const sel = result.releases.find((r) => r.tag === params.get('v')) || sum.latestStable || sum.latest || result.releases[0];
    const asset = primaryAsset(sum.latestStable);
    const links = dlLinks(p);
    const mc = p.compat?.minecraftVersions || [];
    const loaders = p.compat?.loaders || [];
    const kv = (k, v) => (v && String(v).length ? `<dt>${k}</dt><dd>${v}</dd>` : '');
    const lic = p.license?.name ? (safeUrl(p.license.url) ? `<a href="${esc(safeUrl(p.license.url))}" target="_blank" rel="noopener noreferrer">${esc(p.license.name)}</a>` : esc(p.license.name)) : '';
    currentShots = (p.screenshots || []).filter((s) => safeUrl(s.src));
    app.innerHTML = `
    <div class="container">
      ${banner ? `<div class="p-banner"><img src="${esc(banner)}" alt="${esc(p.name)} banner"></div>` : ''}
      <div class="p-head">${iconEl(p, true)}<div>
        <h1>${esc(p.name)}</h1>
        ${p.summary ? `<p class="muted" style="margin-bottom:8px">${esc(p.summary)}</p>` : ''}
        <div class="chips"><span class="chip accent">${esc(typeLabel(p.type))}</span>${status ? channelChip(status) : ''}${(p.categories || []).map((c) => `<span class="chip">${esc(c)}</span>`).join('')}${(p.tags || []).map((t) => `<a class="chip" href="/discover?tag=${encodeURIComponent(t)}" data-link>#${esc(t)}</a>`).join('')}</div>
      </div></div>
      ${status === 'archived' || status === 'discontinued' ? `<div class="notice danger">This project is ${esc(status)}${status === 'discontinued' ? ' and no longer maintained' : ' and is no longer updated'}.</div>` : ''}
      <div class="p-layout">
        <div>
          ${p.description ? `<div class="card panel"><h2>About</h2><div class="prose">${md(p.description)}</div></div>` : ''}
          <div id="release-area"><div class="card panel"><h2>Downloads</h2><div class="skeleton" style="height:90px"></div></div></div>
          ${p.features?.length ? `<div class="card panel"><h2>Features</h2><ul class="prose">${p.features.map((f) => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}
          ${p.install ? `<div class="card panel"><h2>Installation</h2><div class="prose">${md(p.install)}</div></div>` : ''}
          ${gallery(currentShots)}
          ${p.dependencies?.length || p.credits ? `<div class="card panel"><h2>Dependencies and credits</h2>${p.dependencies?.length ? `<ul class="prose">${p.dependencies.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}${p.credits ? `<div class="prose">${md(p.credits)}</div>` : ''}</div>` : ''}
        </div>
        <aside>
          ${asset ? `<div class="card panel"><a class="btn" style="width:100%" href="${esc(asset.url)}" rel="noopener">${I.download} Download ${esc(sum.latestStable.tag)}</a><p class="small muted" style="margin:8px 0 0">${esc(asset.name)} · ${esc(fmtBytes(asset.size))}</p></div>`
            : links.length ? `<div class="card panel"><a class="btn" style="width:100%" href="${esc(links[0].url)}" ${EXT}>${I.download} ${esc(links[0].label || 'Download')}</a><p class="small muted" style="margin:8px 0 0">Hosted on ${esc(hostOf(links[0].url))}</p></div>` : ''}
          <div class="card panel"><h3>Details</h3><dl class="kv">
            ${kv('Author', esc(p.author || DATA.site.owner || ''))}
            ${kv('Version', p.version && !sum.latestStable ? esc(p.version) : '')}
            ${kv('Latest stable', sum.latestStable ? esc(sum.latestStable.tag) : '')}
            ${kv('Minecraft', esc(mc.join(', ')))}
            ${kv('Loaders', esc(loaders.join(', ')))}
            ${kv('Platforms', esc((p.os || []).join(', ')))}
            ${kv('License', lic)}
            ${kv('Permissions', esc(p.license?.permissions || ''))}
            ${kv('Downloads', sum.downloads > 0 ? fmtNumber(sum.downloads) : '')}
          </dl></div>
          ${safeUrl(p.links?.source) || safeUrl(p.links?.issues) || safeUrl(p.links?.website) ? `<div class="card panel"><h3>Links</h3><div class="chips">
            ${safeUrl(p.links?.source) ? `<a href="${esc(safeUrl(p.links.source))}" target="_blank" rel="noopener noreferrer">Source</a>` : ''}
            ${safeUrl(p.links?.issues) ? `<a href="${esc(safeUrl(p.links.issues))}" target="_blank" rel="noopener noreferrer">Issues</a>` : ''}
            ${safeUrl(p.links?.website) ? `<a href="${esc(safeUrl(p.links.website))}" target="_blank" rel="noopener noreferrer">Website</a>` : ''}</div></div>` : ''}
          <a class="btn secondary small" href="/report?project=${esc(p.slug)}" data-link>Report a problem</a>
          ${isConfigured() && isSignedIn() ? `<a class="btn small" href="/admin/edit/${esc(p.slug)}" data-link>Edit this project</a>` : ''}
        </aside>
      </div>
    </div>`;
    const extPanel = links.length ? `<div class="card panel" id="downloads-ext"><h2>Downloads</h2>${p.version ? `<p class="muted small">Version ${esc(p.version)}</p>` : ''}${links.map((d) => `<div class="dl-row"><div><strong>${esc(d.label || 'Download')}</strong><div class="muted small">Hosted on ${esc(hostOf(d.url))}${d.note ? ` · ${esc(d.note)}` : ''}</div></div><a class="btn" href="${esc(d.url)}" ${EXT}>${I.download} Download</a></div>`).join('')}<p class="small muted" style="margin:12px 0 0">These links open a third-party site. Only download files you trust, and scan them if you are unsure.</p></div>` : '';
    $('#release-area').innerHTML = extPanel + (p.repo || !links.length ? releasePanel(p, result, sel) : '');
    $('#ver')?.addEventListener('change', (e) => {
      navigate(`/project/${p.slug}?v=${encodeURIComponent(e.target.value)}`, { replace: true });
    });
    $('[data-retry]')?.addEventListener('click', () => pageProject(slug));
  };

  draw({ state: 'loading', releases: [] });
  const result = await getReleases(p.repo);
  summaries.set(p.slug, summarize(result));
  if (curPath() !== `/project/${p.slug}`) return;
  draw(result);
  const sum = summaries.get(p.slug);
  setJsonLd({
    '@context': 'https://schema.org', '@type': 'SoftwareApplication', name: p.name,
    description: p.summary || undefined, url: `${(DATA.site.baseUrl || location.origin).replace(/\/$/, '')}/project/${p.slug}`,
    author: { '@type': 'Person', name: p.author || DATA.site.owner },
    softwareVersion: sum.latestStable?.tag, operatingSystem: p.os?.length ? p.os.join(', ') : undefined,
  });
}

async function pageUpdates() {
  setMeta({ title: 'Updates', description: 'Announcements and recent releases.', path: '/updates' });
  const feed = [];
  if (DATA.projects.length) {
    await loadSummaries(DATA.projects);
    for (const p of DATA.projects) for (const r of info(p).releases.slice(0, 3)) feed.push({ p, r });
    feed.sort((a, b) => new Date(b.r.date || 0) - new Date(a.r.date || 0));
  }
  const body = [
    DATA.announcements.length ? `<h2>Announcements</h2>${DATA.announcements.map(announcementCard).join('')}` : '',
    feed.length ? `<h2>Recent releases</h2><div class="card panel">${feed.slice(0, 20).map(({ p, r }) => `<div class="dl-row"><div><a href="/project/${esc(p.slug)}?v=${encodeURIComponent(r.tag)}" data-link><strong>${esc(p.name)} ${esc(r.tag)}</strong></a> ${channelChip(r.channel)}</div><span class="muted small">${esc(fmtDate(r.date))}</span></div>`).join('')}</div>` : '',
  ].join('');
  app.innerHTML = pageShell('Updates', body || emptyBox('No updates yet.'));
}

function contactBlock(site) {
  const links = [...(site.discord ? [{ label: 'Discord', url: site.discord }] : []), ...(site.socials || [])].filter((x) => safeUrl(x.url));
  return links.length ? `<div class="cta-row">${links.map((l) => `<a class="btn secondary" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer">${esc(l.label)} ${I.ext}</a>`).join('')}</div>` : '';
}

function mailForm(kind) {
  const email = DATA.site.contactEmail || DATA.site.operator?.email;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email || '')) {
    return `<div class="notice">${kind === 'report' ? 'Reporting' : 'Contact'} by email is not set up yet. The site owner needs to add a contact email in <code>data/site.json</code>.</div>`;
  }
  const project = new URLSearchParams(curSearch()).get('project') || '';
  return `<form class="card panel" id="mail-form" data-email="${esc(email)}" data-kind="${kind}">
    ${kind === 'report' ? `<div class="field"><label for="m-proj">Project (optional)</label><select id="m-proj"><option value="">Not about a specific project</option>${DATA.projects.map((p) => `<option value="${esc(p.slug)}"${p.slug === project ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="m-type">Type</label><select id="m-type"><option>Bug or broken download</option><option>Suspicious file or malware</option><option>Copyright concern</option><option>Other</option></select></div>` : ''}
    <div class="field"><label for="m-sub">Subject</label><input id="m-sub" required maxlength="120"></div>
    <div class="field"><label for="m-msg">Message</label><textarea id="m-msg" required maxlength="3000"></textarea></div>
    <button class="btn" type="submit">Open in email app</button>
    <p class="small muted" style="margin-top:10px">This opens your email app with the message ready to send. Nothing is sent until you send it.</p></form>`;
}

function pageStatic(path) {
  const s = DATA.site;
  const pages = {
    '/about': () => ['About', `<div class="card panel"><h2>${esc(s.owner || 'AbhayTheMaster')}</h2>${s.bio ? `<div class="prose">${md(s.bio)}</div>` : '<p class="muted">Minecraft developer and creator.</p>'}${contactBlock(s)}</div>
      <div class="notice">${esc(s.name || 'This site')} and its projects are independently developed and are not official Minecraft, Mojang or Microsoft products, and are not affiliated with LabyMod or Modrinth.</div>`],
    '/contact': () => ['Contact', `${mailForm('contact')}${contactBlock(s)}`],
    '/support': () => ['Support', `<div class="card panel"><p>Check the <a href="/faq" data-link>FAQ</a> first. For a broken download or suspicious file, use the <a href="/report" data-link>report page</a>.</p>${s.supportInfo ? `<div class="prose">${md(s.supportInfo)}</div>` : ''}${contactBlock(s)}</div>${mailForm('contact')}`],
    '/faq': () => ['FAQ', FAQ.map(([q, a]) => `<details class="card panel"><summary><strong>${esc(q)}</strong></summary><p style="margin-top:10px">${a}</p></details>`).join('')],
    '/report': () => ['Report a problem', mailForm('report')],
    '/privacy-policy': () => ['Privacy Policy', `${legalNote(s)}<div class="prose legal">${privacyPolicy(s)}</div>`],
    '/terms-and-conditions': () => ['Terms and Conditions', `${legalNote(s)}<div class="prose legal">${terms(s)}</div>`],
    '/copyright': () => ['Copyright', `${legalNote(s)}<div class="prose legal">${copyrightPage(s)}</div>`],
    '/licenses': () => ['Licenses', DATA.projects.length
      ? `<p class="muted">Not every project is open source. Each project’s actual license is listed here.</p><div class="card panel" style="overflow-x:auto"><table class="table"><thead><tr><th>Project</th><th>License</th><th>Permissions</th></tr></thead><tbody>${DATA.projects.map((p) => `<tr><td><a href="/project/${esc(p.slug)}" data-link>${esc(p.name)}</a></td><td>${p.license?.name ? (safeUrl(p.license.url) ? `<a href="${esc(safeUrl(p.license.url))}" target="_blank" rel="noopener noreferrer">${esc(p.license.name)}</a>` : esc(p.license.name)) : '<span class="muted">Not specified (all rights reserved)</span>'}</td><td>${esc(p.license?.permissions || '')}</td></tr>`).join('')}</tbody></table></div>`
      : emptyBox('No projects published yet.')],
  };
  const make = pages[path];
  if (!make) return false;
  const [title, body] = make();
  setMeta({ title, description: `${title} – ${s.name || ''}`, path });
  app.innerHTML = pageShell(title, body);
  const form = $('#mail-form');
  form?.addEventListener('submit', (e) => {
    e.preventDefault();
    const kind = form.dataset.kind;
    const subject = $('#m-sub').value.trim();
    let msg = $('#m-msg').value.trim();
    if (kind === 'report') msg = `Project: ${$('#m-proj').value || 'n/a'}\nType: ${$('#m-type').value}\n\n${msg}`;
    location.href = `mailto:${form.dataset.email}?subject=${encodeURIComponent(`${kind === 'report' ? '[Report] ' : ''}${subject}`)}&body=${encodeURIComponent(msg)}`;
  });
  return true;
}

function noIndex() {
  if ($('#noindex')) return;
  const m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex'; m.id = 'noindex'; document.head.appendChild(m);
}

/* Owner context + the floating "+" button (only exists while the owner is signed in). */
const ownerCtx = {
  go: (u) => navigate(u),
  refresh: async () => { await loadData(); summaries.clear(); renderFooter(); },
  authChanged: () => syncFab(curPath()),
  siteDefaults: () => { const { supabase, ...rest } = DATA.site; return rest; },
  get owner() { return DATA.site.owner || 'AbhayTheMaster'; },
};
function syncFab(path = curPath()) {
  const show = isConfigured() && isSignedIn() && !/^\/admin\/(new|edit\/)/.test(path);
  let el = document.getElementById('fab');
  if (!show) { el?.remove(); return; }
  if (!el) {
    el = document.createElement('a');
    el.id = 'fab'; el.className = 'fab'; el.setAttribute('data-link', ''); el.setAttribute('aria-label', 'Add a new project'); el.setAttribute('title', 'Add a new project');
    el.setAttribute('href', '/admin/new'); el.innerHTML = I.plus;
    document.body.appendChild(el);
  }
}

function pageNotFound() {
  setMeta({ title: 'Page not found', path: curPath() });
  noIndex();
  app.innerHTML = `<div class="container section" style="text-align:center"><h1>404</h1><p class="muted">That page doesn’t exist.</p><a class="btn" href="/" data-link>Back home</a></div>`;
}

/* ---------- Router ---------- */
async function render() {
  $('#noindex')?.remove();
  $('#ld')?.remove();
  const path = curPath().replace(/\/+$/, '') || '/';
  const typeRoutes = { '/mods': 'mod', '/launchers': 'launcher', '/tools': 'tool' };
  if (typeRoutes[path]) {
    history.replaceState({}, '', urlFor(`/discover?type=${typeRoutes[path]}`));
    return render();
  }
  lastKey = curPath() + curSearch();
  markActiveNav();
  syncFab(path);
  const active = document.activeElement;
  const focusId = active?.id === 'f-q' ? { start: active.selectionStart } : null;
  try {
    const m = path.match(/^\/project\/([^/]+)$/);
    const adminPath = path === '/admin' || path.startsWith('/admin/');
    if (adminPath && isConfigured()) { noIndex(); setMeta({ title: 'Owner', path }); await mountOwner(app, path, ownerCtx); }
    else if (adminPath && DATA.supaProblem && DATA.supaProblem !== 'not-configured') {
      noIndex(); app.innerHTML = `<div class="container section" style="max-width:640px"><h1>Owner area</h1><div class="notice danger">${esc(DATA.supaProblem)}</div></div>`;
    } else if (HASH && path === '/admin' && window.__mountAdmin) { noIndex(); setMeta({ title: 'Owner tool', path }); window.__mountAdmin(app); }
    else if (path === '/') await pageHome();
    else if (path === '/discover') await pageDiscover();
    else if (path === '/updates') await pageUpdates();
    else if (m) await pageProject(decodeURIComponent(m[1]));
    else if (!pageStatic(path)) pageNotFound();
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="container section"><div class="notice danger">Something went wrong loading this page. Please refresh and try again.</div></div>`;
  }
  if (focusId && $('#f-q')) { const q = $('#f-q'); q.focus(); q.setSelectionRange(focusId.start, focusId.start); }
}

function navigate(url, { replace = false } = {}) {
  if (replace) history.replaceState({}, '', urlFor(url));
  else history.pushState({}, '', urlFor(url));
  render();
  if (!replace) { window.scrollTo(0, 0); }
}

/* ---------- Global events ---------- */
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-link]');
  if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0) {
    e.preventDefault();
    setDrawer(false);
    closeFilters();
    navigate(a.dataset.path || a.getAttribute('href'));
    return;
  }
  const t = e.target.closest('button');
  if (e.target.id === 'scrim' || e.target.closest('[data-close]') || e.target.closest('[data-close-filters]')) { setDrawer(false); closeFilters(); }
  if (!t) return;
  if (t.id === 'menu-btn') setDrawer(true);
  if (t.id === 'theme-btn') {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch { /* storage unavailable */ }
    syncThemeIcon();
  }
  if (t.dataset.shot !== undefined) openLightbox(Number(t.dataset.shot));
  if (t.dataset.lb === 'close') closeLightbox();
  if (t.dataset.lb === 'prev') openLightbox(lbIndex - 1);
  if (t.dataset.lb === 'next') openLightbox(lbIndex + 1);
});

function closeFilters() {
  const panel = $('#filters');
  if (panel?.classList.contains('drawer')) {
    panel.classList.remove('drawer', 'open');
    panel.querySelector('.drawer-top')?.remove();
    $('#scrim').classList.remove('open');
  }
}

document.addEventListener('keydown', (e) => {
  if ($('#lightbox')?.classList.contains('open')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') openLightbox(lbIndex - 1);
    if (e.key === 'ArrowRight') openLightbox(lbIndex + 1);
  } else if (e.key === 'Escape') { setDrawer(false); closeFilters(); }
});
$('#lightbox')?.addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });

const debouncedFilter = debounce(filterChange, 300);
document.addEventListener('input', (e) => { if (e.target.id === 'f-q') debouncedFilter(e.target); });
document.addEventListener('change', (e) => { if (e.target.dataset?.filter && e.target.id !== 'f-q') filterChange(e.target); });
document.addEventListener('submit', (e) => {
  if (e.target.id === 'nav-search' || e.target.id === 'drawer-search') {
    e.preventDefault();
    const q = e.target.querySelector('input').value.trim();
    setDrawer(false);
    navigate(`/discover${toQuery({ q })}`);
  }
});
// Graceful image fallback: hide broken images instead of showing a broken icon.
document.addEventListener('error', (e) => { if (e.target.tagName === 'IMG') e.target.classList.add('img-missing'); }, true);
const onNav = () => { if (curPath() + curSearch() !== lastKey) render(); };
window.addEventListener('popstate', onNav);
if (HASH) {
  window.addEventListener('hashchange', onNav);
  // Rewrite internal links to #/path so they also work when opened in a new tab.
  const fixLinks = () => document.querySelectorAll('a[data-link]:not([data-path])').forEach((a) => {
    const h = a.getAttribute('href');
    if (h && h.startsWith('/')) { a.dataset.path = h; a.setAttribute('href', `#${h}`); }
  });
  new MutationObserver(fixLinks).observe(document.body, { childList: true, subtree: true });
  fixLinks();
}

/* ---------- Boot ---------- */
(async function boot() {
  await loadData();
  renderHeader();
  renderFooter();
  // Lightbox overlay is created by renderHeader; re-bind backdrop click.
  $('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });
  await render();
})();


})();
</script>
</body>
</html>
