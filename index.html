    video ? `<div class="video" id="video"><button type="button" data-video="${esc(video)}" aria-label="Play video"><span><i>${I.play}</i><b>Watch the video</b><small style="opacity:.75">Loads from YouTube when you press play</small></span></button></div>` : '',
    p.description ? `<div class="card panel"><h2>About</h2><div class="prose">${md(p.description)}</div></div>` : '',
    highlights.length ? `<div class="card panel"><h2>Highlights</h2><div class="hl-grid">${highlights.map((h) => `<div class="hl"><i>${I.spark}</i><b>${esc(h.title)}</b>${h.text ? `<span>${esc(h.text)}</span>` : ''}</div>`).join('')}</div></div>` : '',
    feats.length ? `<div class="card panel"><h2>Features</h2><ul class="checks">${feats.map((f) => `<li>${esc(f)}</li>`).join('')}</ul></div>` : '',
    p.requirements ? `<div class="card panel"><h2>Requirements</h2><div class="prose">${md(p.requirements)}</div></div>` : '',
    p.install ? `<div class="card panel"><h2>How to install</h2><div class="prose">${md(p.install)}</div></div>` : '',
    faq.length ? `<div class="card panel"><h2>Questions</h2>${faq.map((f) => `<details class="card" style="margin-bottom:8px;background:var(--card-2)"><summary><strong>${esc(f.q)}</strong></summary><p class="prose" style="margin-top:2px">${esc(f.a || '')}</p></details>`).join('')}</div>` : '',
    p.dependencies?.length || p.credits ? `<div class="card panel"><h2>Dependencies and credits</h2>${p.dependencies?.length ? `<ul class="prose">${p.dependencies.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}${p.credits ? `<div class="prose">${md(p.credits)}</div>` : ''}</div>` : '',
  ].join('');

  app.innerHTML = `
  ${draft ? `<div class="draft-bar">Draft preview. Only you can see this page. <a href="/admin/edit/${esc(p.slug)}" data-link style="color:inherit;text-decoration:underline">Edit</a></div>` : ''}
  <div class="proj" style="--pa:${accentOf(p)}">
    <div class="container">
      <div class="cover"><a class="back" href="/discover" data-link>${I.left} All projects</a>${banner ? `<img src="${esc(banner)}" alt="${esc(p.name)} banner">` : ''}</div>
      <div class="p-id">${iconEl(p, true)}<div class="p-id-text">
        <h1>${esc(p.name)}</h1>
        <div class="meta"><span class="chip accent">${esc(typeOne(p.type))}</span>${status ? channelChip(status) : ''}<span id="p-rating">${ratingLine(rating0)}</span>${p.author ? `<span>by ${esc(p.author)}</span>` : ''}</div>
      </div></div>
      ${p.summary ? `<p class="p-sum">${esc(p.summary)}</p>` : ''}
      ${status === 'archived' || status === 'discontinued' ? `<div class="notice danger" style="margin-top:16px">This project is ${esc(status)}${status === 'discontinued' ? ' and no longer maintained' : ' and is no longer updated'}.</div>` : ''}
      <div class="p-cta" id="p-cta"></div>
      <div class="facts" id="facts"></div>
      <div class="tabs" role="tablist" aria-label="Project sections">${tabs.map(([k, l]) => `<button class="tab" role="tab" type="button" data-tab="${k}" id="tab-${k}" aria-controls="tp-${k}" aria-selected="${k === tab}">${l}${k === 'reviews' && rating0 ? `<small>${rating0.n}</small>` : ''}</button>`).join('')}</div>
      <div class="p-layout">
        <div>
          <div class="tabpanel" role="tabpanel" id="tp-overview" aria-labelledby="tab-overview"${tab === 'overview' ? '' : ' hidden'}>${overview || `<div class="card panel"><p class="muted" style="margin:0">Nothing more to show yet. Check the Downloads tab.</p></div>`}</div>
          <div class="tabpanel" role="tabpanel" id="tp-downloads" aria-labelledby="tab-downloads"${tab === 'downloads' ? '' : ' hidden'}><div id="release-area"></div></div>
          ${p.changelog ? `<div class="tabpanel" role="tabpanel" id="tp-changelog" aria-labelledby="tab-changelog"${tab === 'changelog' ? '' : ' hidden'}><div class="card panel"><h2>Changelog</h2><div class="prose">${md(p.changelog)}</div></div></div>` : ''}
          ${hasReviews ? `<div class="tabpanel" role="tabpanel" id="tp-reviews" aria-labelledby="tab-reviews"${tab === 'reviews' ? '' : ' hidden'}><div class="card panel"><h2>Ratings and reviews</h2><div id="reviews-root"></div></div></div>` : ''}
        </div>
        <aside>
          <div id="side-dl"></div>
          <div class="card panel"><h3>Details</h3><dl class="kv" id="kv"></dl></div>
          ${sideHelp(p.slug)}
          ${safeUrl(p.links?.source) || safeUrl(p.links?.issues) || safeUrl(p.links?.website) ? `<div class="card panel"><h3>Links</h3><div class="chips">
            ${safeUrl(p.links?.source) ? `<a class="chip" href="${esc(safeUrl(p.links.source))}" target="_blank" rel="noopener noreferrer">Source</a>` : ''}
            ${safeUrl(p.links?.issues) ? `<a class="chip" href="${esc(safeUrl(p.links.issues))}" target="_blank" rel="noopener noreferrer">Issues</a>` : ''}
            ${safeUrl(p.links?.website) ? `<a class="chip" href="${esc(safeUrl(p.links.website))}" target="_blank" rel="noopener noreferrer">Website</a>` : ''}</div></div>` : ''}
          ${(p.tags || []).length ? `<div class="card panel"><h3>Tags</h3><div class="chips">${p.tags.map((t) => `<a class="chip" href="/discover?tag=${encodeURIComponent(t)}" data-link>#${esc(t)}</a>`).join('')}</div></div>` : ''}
          <div class="cta-row" style="margin-top:0"><a class="btn secondary small" href="/report?project=${esc(p.slug)}" data-link>Report a problem</a>
          ${isConfigured() && isSignedIn() ? `<a class="btn small" href="/admin/edit/${esc(p.slug)}" data-link>Edit this project</a>` : ''}</div>
        </aside>
      </div>
    </div>
  </div>`;

  const root = $('.proj');
  const setTab = (name, scroll) => {
    if (!tabs.some(([k]) => k === name)) return;
    tab = name;
    root.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
    root.querySelectorAll('.tabpanel').forEach((el) => { el.hidden = el.id !== `tp-${name}`; });
    const q = new URLSearchParams(curSearch());
    if (name === 'overview') q.delete('tab'); else q.set('tab', name);
    const qs = q.toString();
    history.replaceState({}, '', urlFor(`${curPath()}${qs ? `?${qs}` : ''}`));
    lastKey = curPath() + curSearch();
    if (scroll) $('.tabs', root).scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]');
    if (t) { setTab(t.dataset.tab); return; }
    const go = e.target.closest('[data-tab-go]');
    if (go) { setTab(go.dataset.tabGo, true); return; }
    const vf = e.target.closest('[data-vf]');
    if (vf) { vfilter = vf.dataset.vf; paintVersions(); return; }
    if (e.target.closest('[data-unlock]')) openUnlock(p, paintDownloads);
    const vid = e.target.closest('[data-video]');
    if (vid) { $('#video').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${esc(vid.dataset.video)}?autoplay=1&rel=0" title="${esc(p.name)} video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`; }
    if (e.target.closest('[data-share]')) share(p);
    if (e.target.closest('[data-retry]')) pageProject(slug);
  });
  root.addEventListener('change', (e) => {
    if (e.target.id === 'ver') navigate(`/project/${p.slug}?tab=downloads&v=${encodeURIComponent(e.target.value)}`, { replace: true });
  });

  const paintVersions = () => { const el = $('#downloads-ver', root); if (el) el.outerHTML = versionsPanel(p, vfilter); };

  function paintDownloads() {
    const sum = summarize(result);
    const sel = result.releases.find((r) => r.tag === params.get('v')) || sum.latestStable || sum.latest || result.releases[0];
    const asset = primaryAsset(sum.latestStable);
    const verLabel = versions[0]?.name || sum.latestStable?.tag || p.version || '';
    // hero buttons
    let cta = '';
    if (versions.length || (links.length > 1)) cta = `<button class="btn big" type="button" data-tab-go="downloads">${I.download} Download</button>`;
    else if (asset) cta = `<a class="btn big" href="${esc(asset.url)}" rel="noopener">${I.download} Download ${esc(sum.latestStable.tag)}</a>`;
    else if (links.length === 1) cta = `<a class="btn big" href="${esc(links[0].url)}" ${EXT}>${I.download} ${esc(links[0].label || 'Download')}</a>`;
    $('#p-cta').innerHTML = `${cta}${hasReviews ? `<button class="btn secondary big" type="button" data-tab-go="reviews">Reviews</button>` : ''}<button class="btn secondary big" type="button" data-share aria-label="Share">${I.share} Share</button>`;
    $('#side-dl').innerHTML = cta && !versions.length && links.length <= 1 ? `<div class="card panel">${cta.replace('btn big', 'btn')}<p class="small muted" style="margin:8px 0 0">${asset ? `${esc(asset.name)} · ${esc(fmtBytes(asset.size))}` : `Hosted on ${esc(hostOf(links[0]?.url))}`}</p></div>` : '';
    if ($('#side-dl a.btn')) $('#side-dl a.btn').style.width = '100%';
    // facts + details
    const facts = [['Version', verLabel && `v${verLabel.replace(/^v/i, '')}`], ['Minecraft', mcShort(mcAll)], ['Loader', ldAll.join(', ')], ['Platform', (p.os || []).join(', ')]].filter(([, v]) => v);
    $('#facts').innerHTML = facts.map(([k, v]) => `<div class="fact"><span>${k}</span><b>${esc(v)}</b></div>`).join('');
    $('#facts').hidden = !facts.length;
    $('#kv').innerHTML = [kv('Type', esc(typeOne(p.type))), kv('Author', esc(p.author || DATA.site.owner || '')), kv('Version', verLabel ? esc(verLabel) : ''), kv('Updated', p.updated ? esc(fmtDate(p.updated)) : ''), kv('Minecraft', esc(mcAll.join(', '))), kv('Loaders', esc(ldAll.join(', '))), kv('Platforms', esc((p.os || []).join(', '))), kv('License', lic), kv('Permissions', esc(p.license?.permissions || '')), kv('Downloads', sum.downloads > 0 ? fmtNumber(sum.downloads) : '')].join('');
    // downloads tab
    const extPanel = links.length ? `<div class="card panel" id="downloads-ext"><h2>Downloads</h2>${links.map((d) => `<div class="dl-row"><div><strong>${esc(d.label || 'Download')}</strong><div class="muted small">Hosted on ${esc(hostOf(d.url))}${d.note ? ` · ${esc(d.note)}` : ''}</div></div><a class="btn" href="${esc(d.url)}" ${EXT}>${I.download} Download</a></div>`).join('')}<p class="small muted" style="margin:12px 0 0">These links open a third-party site. Only download files you trust, and scan them if you are unsure.</p></div>` : '';
    const showGh = p.repo || (!links.length && !versions.length);
    $('#release-area').innerHTML = versionsPanel(p, vfilter) + extPanel + (showGh ? releasePanel(p, result, sel) : '');
  }

  paintDownloads();
  setupReveal();
  const rnode = $('#reviews-root');
  if (rnode) {
    mountReviews(rnode, p, {
      logo: LOGO, owner: p.author || DATA.site.owner || 'AbhayTheMaster',
      onSummary: (s) => {
        if (s) DATA.ratings[p.id] = s; else if (DATA.ratings) delete DATA.ratings[p.id];
        const pr = $('#p-rating'); if (pr) pr.innerHTML = ratingLine(s);
        const tb = $('#tab-reviews'); if (tb) tb.innerHTML = `Reviews${s ? `<small>${s.n}</small>` : ''}`;
        if (s && curPath() === `/project/${p.slug}`) setJsonLd(ld(p, summarize(result), s));
      },
    });
  }
  // Remembered access code: unlock silently (a revoked code is forgotten).
  if (p.id && versions.some((v) => v.restricted) && savedCodes()[p.id]) {
    tryUnlock(p, savedCodes()[p.id]).then((r) => {
      if (!r.ok && /not valid|expired|maximum/i.test(r.error || '')) { const m = savedCodes(); delete m[p.id]; lsSet('abhay-codes', JSON.stringify(m)); }
      if (curPath() === `/project/${p.slug}`) paintDownloads();
    }).catch(() => {});
  }

  if (p.repo) {
    result = await getReleases(p.repo);
    summaries.set(p.slug, summarize(result));
    if (curPath() !== `/project/${p.slug}`) return;
    paintDownloads();
  } else {
    result = { state: 'unconfigured', releases: [] };
    paintDownloads();
  }
  setJsonLd(ld(p, summarize(result), DATA.ratings?.[p.id]));
}

function ld(p, sum, rating) {
  return {
    '@context': 'https://schema.org', '@type': 'SoftwareApplication', name: p.name,
    description: p.summary || undefined, url: `${(DATA.site.baseUrl || location.origin).replace(/\/$/, '')}/project/${p.slug}`,
    author: { '@type': 'Person', name: p.author || DATA.site.owner },
    softwareVersion: sum.latestStable?.tag, operatingSystem: p.os?.length ? p.os.join(', ') : undefined,
    ...(rating && rating.n > 0 ? { aggregateRating: { '@type': 'AggregateRating', ratingValue: Number(rating.avg.toFixed(2)), ratingCount: rating.n, bestRating: 5, worstRating: 1 } } : {}),
  };
}

async function pageUpdates() {
  setMeta({ title: 'Updates', description: 'Announcements and recent releases.', path: '/updates' });
  const feed = [];
  if (DATA.projects.length) {
    await loadSummaries(DATA.projects);
    for (const p of DATA.projects) for (const r of info(p).releases.slice(0, 3)) feed.push({ p, r });
    feed.sort((a, b) => new Date(b.r.date || 0) - new Date(a.r.date || 0));
  }
  const body = [
    DATA.announcements.length ? `<h2>Announcements</h2>${DATA.announcements.map(announcementCard).join('')}` : '',
    feed.length ? `<h2 style="margin-top:28px">Recent releases</h2><div class="card panel">${feed.slice(0, 20).map(({ p, r }) => `<div class="dl-row"><div><a href="/project/${esc(p.slug)}?tab=downloads&v=${encodeURIComponent(r.tag)}" data-link><strong>${esc(p.name)} ${esc(r.tag)}</strong></a> ${channelChip(r.channel)}</div><span class="muted small">${esc(fmtDate(r.date))}</span></div>`).join('')}</div>` : '',
  ].join('');
  const h = igHandle();
  app.innerHTML = pageShell('Updates', (body || emptyBox('No updates yet.')) + (h ? `<div class="card panel" style="margin-top:24px"><h3>Get every update first</h3><p class="muted">New releases and development news are posted on Instagram.</p><a class="btn" href="${esc(igUrl(h))}" ${EXT}>${I.insta} Follow @${esc(h)}</a></div>` : ''));
}

function contactBlock(site) {
  const links = socialLinks(site);
  return links.length ? `<div class="cta-row">${links.map((l) => `<a class="btn secondary" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer">${esc(l.label)} ${I.ext}</a>`).join('')}</div>` : '';
}

const validEmail = () => { const e = DATA.site.contactEmail || DATA.site.operator?.email; return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e || '') ? e : ''; };

function mailForm(kind) {
  const email = validEmail();
  if (!email) {
    return `<div class="notice">${kind === 'report' ? 'Reporting' : 'Contact'} by email is not set up yet. The site owner can add a contact email in Site settings.</div>`;
  }
  const project = new URLSearchParams(curSearch()).get('project') || '';
  return `<form class="card panel" id="mail-form" data-email="${esc(email)}" data-kind="${kind}">
    ${kind === 'report' ? `<div class="field"><label for="m-proj">Project (optional)</label><select id="m-proj"><option value="">Not about a specific project</option>${DATA.projects.map((p) => `<option value="${esc(p.slug)}"${p.slug === project ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="m-type">Type</label><select id="m-type"><option>Bug or broken download</option><option>Suspicious file or malware</option><option>Copyright concern</option><option>Other</option></select></div>` : ''}
    <div class="field"><label for="m-sub">Subject</label><input id="m-sub" required maxlength="120"></div>
    <div class="field"><label for="m-msg">Message</label><textarea id="m-msg" required maxlength="3000"></textarea></div>
    <button class="btn" type="submit">Open in email app</button>
    <p class="small muted" style="margin-top:10px">This opens your email app with the message ready to send. Nothing is sent until you send it.</p></form>`;
}

function pageStatic(path) {
  const s = DATA.site;
  const h = igHandle();
  const pages = {
    '/about': () => ['About', `<div class="card panel"><h2>${esc(s.owner || 'AbhayTheMaster')}</h2>${s.bio ? `<div class="prose">${md(s.bio)}</div>` : '<p class="muted">Minecraft developer and creator.</p>'}${contactBlock(s)}</div>
      <div class="notice">${esc(s.name || 'This site')} and its projects are independently developed and are not official Minecraft, Mojang or Microsoft products, and are not affiliated with LabyMod or Modrinth.</div>`],
    '/contact': () => ['Contact', `${mailForm('contact')}${contactBlock(s)}`],
    '/support': () => ['Help and support', `${h ? `<div class="help" style="margin-bottom:22px"><span class="ig-handle"><img src="${LOGO}" alt="" width="26" height="26">@${esc(h)}</span><h2>Crash? Bug? Tell me.</h2><p>Use the helper to write a clear message, then send it to me on Instagram. I help fix crashes and mod problems.</p><div class="cta-row" style="margin-top:14px"><button class="btn light" type="button" data-help>${I.bug} Get crash help</button><a class="btn dark" href="${esc(igUrl(h))}" ${EXT}>${I.insta} Follow @${esc(h)}</a></div></div>` : ''}
      <div class="card panel"><p>Check the <a href="/faq" data-link>FAQ</a> first. For a broken download or suspicious file, use the <a href="/report" data-link>report page</a>.</p>${s.supportInfo ? `<div class="prose">${md(s.supportInfo)}</div>` : ''}${h ? '' : contactBlock(s)}</div>${validEmail() ? mailForm('contact') : ''}`],
    '/faq': () => ['FAQ', FAQ.map(([q, a]) => `<details class="card" style="margin-bottom:10px"><summary><strong>${esc(q)}</strong></summary><p>${a}</p></details>`).join('')],
    '/report': () => ['Report a problem', mailForm('report')],
    '/privacy-policy': () => ['Privacy Policy', `${legalNote(s)}<div class="prose legal">${privacyPolicy(s)}</div>`],
    '/terms-and-conditions': () => ['Terms and Conditions', `${legalNote(s)}<div class="prose legal">${terms(s)}</div>`],
    '/copyright': () => ['Copyright', `${legalNote(s)}<div class="prose legal">${copyrightPage(s)}</div>`],
    '/licenses': () => ['Licenses', DATA.projects.length
      ? `<p class="muted">Not every project is open source. Each project’s actual license is listed here.</p><div class="card panel" style="overflow-x:auto"><table class="table"><thead><tr><th>Project</th><th>License</th><th>Permissions</th></tr></thead><tbody>${DATA.projects.map((p) => `<tr><td><a href="/project/${esc(p.slug)}" data-link>${esc(p.name)}</a></td><td>${p.license?.name ? (safeUrl(p.license.url) ? `<a href="${esc(safeUrl(p.license.url))}" target="_blank" rel="noopener noreferrer">${esc(p.license.name)}</a>` : esc(p.license.name)) : '<span class="muted">Not specified (all rights reserved)</span>'}</td><td>${esc(p.license?.permissions || '')}</td></tr>`).join('')}</tbody></table></div>`
      : emptyBox('No projects published yet.')],
  };
  const make = pages[path];
  if (!make) return false;
  const [title, body] = make();
  setMeta({ title, description: `${title} – ${s.name || ''}`, path });
  app.innerHTML = pageShell(title, body);
  const form = $('#mail-form');
  form?.addEventListener('submit', (e) => {
    e.preventDefault();
    const kind = form.dataset.kind;
    const subject = $('#m-sub').value.trim();
    let msg = $('#m-msg').value.trim();
    if (kind === 'report') msg = `Project: ${$('#m-proj').value || 'n/a'}\nType: ${$('#m-type').value}\n\n${msg}`;
    location.href = `mailto:${form.dataset.email}?subject=${encodeURIComponent(`${kind === 'report' ? '[Report] ' : ''}${subject}`)}&body=${encodeURIComponent(msg)}`;
  });
  return true;
}

function noIndex() {
  if ($('#noindex')) return;
  const m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex'; m.id = 'noindex'; document.head.appendChild(m);
}

/* Owner context + the floating "+" button (only exists while the owner is signed in). */
const ownerCtx = {
  go: (u) => navigate(u),
  refresh: async () => { await loadData(); summaries.clear(); renderFooter(); },
  authChanged: () => syncFab(curPath()),
  siteDefaults: () => { const { supabase, ...rest } = DATA.site; return rest; },
  get owner() { return DATA.site.owner || 'AbhayTheMaster'; },
  logo: LOGO,
};
function syncFab(path = curPath()) {
  const show = isConfigured() && isSignedIn() && !/^\/admin\/(new|edit\/)/.test(path);
  let el = document.getElementById('fab');
  if (!show) { el?.remove(); return; }
  if (!el) {
    el = document.createElement('a');
    el.id = 'fab'; el.className = 'fab'; el.setAttribute('data-link', ''); el.setAttribute('aria-label', 'Add a new project'); el.setAttribute('title', 'Add a new project');
    el.setAttribute('href', '/admin/new'); el.innerHTML = I.plus;
    document.body.appendChild(el);
  }
}

function pageNotFound() {
  setMeta({ title: 'Page not found', path: curPath() });
  noIndex();
  app.innerHTML = `<div class="container section" style="text-align:center"><h1>404</h1><p class="muted">That page doesn’t exist.</p><a class="btn" href="/" data-link>Back home</a></div>`;
}

/* ---------- Router ---------- */
async function render() {
  $('#noindex')?.remove();
  $('#ld')?.remove();
  const path = curPath().replace(/\/+$/, '') || '/';
  const typeRoutes = { '/mods': 'mod', '/launchers': 'launcher', '/tools': 'tool' };
  if (typeRoutes[path]) {
    history.replaceState({}, '', urlFor(`/discover?type=${typeRoutes[path]}`));
    return render();
  }
  lastKey = curPath() + curSearch();
  markActiveNav();
  syncFab(path);
  const active = document.activeElement;
  const focusId = active?.id === 'f-q' ? { start: active.selectionStart } : null;
  try {
    const m = path.match(/^\/project\/([^/]+)$/);
    const adminPath = path === '/admin' || path.startsWith('/admin/');
    if (adminPath && isConfigured()) { noIndex(); setMeta({ title: 'Owner', path }); await mountOwner(app, path, ownerCtx); }
    else if (adminPath && DATA.supaProblem && DATA.supaProblem !== 'not-configured') {
      noIndex(); app.innerHTML = `<div class="container section" style="max-width:640px"><h1>Owner area</h1><div class="notice danger">${esc(DATA.supaProblem)}</div></div>`;
    } else if (HASH && path === '/admin' && window.__mountAdmin) { noIndex(); setMeta({ title: 'Owner tool', path }); window.__mountAdmin(app); }
    else if (path === '/') await pageHome();
    else if (path === '/discover') await pageDiscover();
    else if (path === '/updates') await pageUpdates();
    else if (m) await pageProject(decodeURIComponent(m[1]));
    else if (!pageStatic(path)) pageNotFound();
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="container section"><div class="notice danger">Something went wrong loading this page. Please refresh and try again.</div></div>`;
  }
  setupReveal();
  if (focusId && $('#f-q')) { const q = $('#f-q'); q.focus(); q.setSelectionRange(focusId.start, focusId.start); }
}

function navigate(url, { replace = false } = {}) {
  if (replace) history.replaceState({}, '', urlFor(url));
  else history.pushState({}, '', urlFor(url));
  render();
  if (!replace) { window.scrollTo(0, 0); }
}

/* ---------- Global events ---------- */
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-link]');
  if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0) {
    e.preventDefault();
    setDrawer(false);
    closeOverlays();
    navigate(a.dataset.path || a.getAttribute('href'));
    return;
  }
  const card = e.target.closest('[data-href]');
  if (card && !e.target.closest('a, button') && !e.metaKey && !e.ctrlKey) { navigate(card.dataset.href); return; }
  if (e.target.closest('[data-help]')) { openHelp(e.target.closest('[data-help]').dataset.help || ''); return; }
  if (e.target.closest('[data-sheet-close]') || e.target.classList?.contains('overlay')) { closeOverlays(); return; }
  const t = e.target.closest('button');
  if (e.target.id === 'scrim' || e.target.closest('[data-close]')) setDrawer(false);
  if (!t) return;
  if (t.id === 'open-search' || t.id === 'open-search-m') openCmd();
  if (t.id === 'menu-btn') setDrawer(true);
  if (t.id === 'theme-btn') {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch { /* storage unavailable */ }
    syncThemeIcon();
  }
  if (t.dataset.shot !== undefined) openLightbox(Number(t.dataset.shot));
  if (t.dataset.lb === 'close') closeLightbox();
  if (t.dataset.lb === 'prev') openLightbox(lbIndex - 1);
  if (t.dataset.lb === 'next') openLightbox(lbIndex + 1);
});

document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); openCmd(); return; }
  if (e.key === '/' && !typing && !document.querySelector('.overlay.open')) { e.preventDefault(); openCmd(); return; }
  if ($('#lightbox')?.classList.contains('open')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') openLightbox(lbIndex - 1);
    if (e.key === 'ArrowRight') openLightbox(lbIndex + 1);
    return;
  }
  if ($('#cmd')?.classList.contains('open') && document.activeElement?.id === 'cmd-q') {
    const n = document.querySelectorAll('#cmd-list .cmd-item').length;
    if (e.key === 'ArrowDown') { e.preventDefault(); cmdSel = (cmdSel + 1) % Math.max(n, 1); markCmd(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); cmdSel = (cmdSel - 1 + n) % Math.max(n, 1); markCmd(); }
    if (e.key === 'Enter') { e.preventDefault(); document.querySelectorAll('#cmd-list .cmd-item')[cmdSel]?.click(); }
  }
  if (e.key === 'Escape') { setDrawer(false); closeOverlays(); }
});

const debouncedFilter = debounce(filterChange, 300);
document.addEventListener('input', (e) => {
  if (e.target.id === 'f-q') debouncedFilter(e.target);
  if (e.target.id === 'cmd-q') fillCmd(e.target.value);
});
document.addEventListener('change', (e) => { if (e.target.dataset?.filter && e.target.id !== 'f-q') filterChange(e.target); });
// Graceful image fallback: hide broken images instead of showing a broken icon.
document.addEventListener('error', (e) => { if (e.target.tagName === 'IMG') e.target.classList.add('img-missing'); }, true);
const onNav = () => { if (curPath() + curSearch() !== lastKey) render(); };
window.addEventListener('popstate', onNav);
if (HASH) {
  window.addEventListener('hashchange', onNav);
  // Rewrite internal links to #/path so they also work when opened in a new tab.
  const fixLinks = () => document.querySelectorAll('a[data-link]:not([data-path])').forEach((a) => {
    const h = a.getAttribute('href');
    if (h && h.startsWith('/')) { a.dataset.path = h; a.setAttribute('href', `#${h}`); }
  });
  new MutationObserver(fixLinks).observe(document.body, { childList: true, subtree: true });
  fixLinks();
}

/* ---------- Boot ---------- */
(async function boot() {
  await loadData();
  renderHeader();
  renderFooter();
  $('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });
  await render();
})();


})();
</script>
</body>
</html>
